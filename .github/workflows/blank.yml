name: Build APK Fixed

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'ShortsForeverBlocker'
          include ':app'
          EOF

      - name: Fix root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Fix app build.gradle
        run: |
          mkdir -p app

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.hungccss.shortsforever'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.hungccss.shortsforever'
                  minSdk 26
                  targetSdk 35
                  versionCode 3
                  versionName '1.0.2'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: Install Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check Android module
        run: |
          echo "===== PROJECTS ====="
          gradle projects

          echo "===== APP FILES ====="
          find app -maxdepth 4 -type f | sort

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShortsForeverBlocker-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
